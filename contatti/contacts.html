    <main class="page-main contact-page">

        <div class="contact-art" aria-hidden="true">
            <img class="contact-cat" src="../assets/img/new_img/CatC.svg" alt="cat destroing a letter">
        </div>

        <form id="contact-form" class="contact-form">
            <h1 class="title-contacts">Send a message</h1>

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="write your name here...">
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="reply_to" required placeholder="write your email here...">
            </div>

            <div class="field">
                <label for="message">Write your message here</label>
                <textarea id="message" name="message" rows="6" required placeholder="Write your message here..."></textarea>
            </div>

            <button id="send-btn" type="submit" class="btn-site btn-site--solid btn-send">Send</button>
            
        </form>


    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

    <script>
        // 1. Inizializza EmailJS
        (function () {
            emailjs.init("wXW8oK8E_MnC4u5mF");
        })();

        // 2. Gestione invio form
        document.getElementById("contact-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const btn = document.getElementById("send-btn");
            btn.disabled = true;
            btn.innerText = "Sending...";

            emailjs.sendForm(
                "service_3z5crid",
                "template_bvqbpyt",
                this
            ).then(
                function () {
                    alert("Message sent successfully!");
                    document.getElementById("contact-form").reset();
                    btn.disabled = false;
                    btn.innerText = "Send";
                },
                function (error) {
                    alert("Something went wrong! Please try again.");
                    console.error("EmailJS error:", error);
                    btn.disabled = false;
                    btn.innerText = "Send";
                }
            );
        });
    </script>
