    <main>
    
<section>
    <form class="contact-form">
        <h1 class="title-contacts order-2"><strong>Sand a message</strong></h1>
        <img src="../assets/img/lettera.svg" class="img-lettera order-1" alt="lettera" style="width: 300px; height: 200px;">

        <div class="all-field order-3">
        <div class="field">
           <label for="name">Name</label>
           <input type="text" id="name" name="name" required placeholder="write your name here...">
        </div>
        <div class="field">
          <label for="subject">Email</label>
          <input type="email" id="email" name="email" required placeholder="write your email here...">
        </div>
        <div class="field">
          <label for="subject">Write your message here</label>
          <textarea id="message" name="message" rows="6" required placeholder="Write your message here..."></textarea>
        </div>
        </div>
        <button type="submit" class="btn-send order-4">Send</button>
    </form>
</section>
